server:
  port: 8080

spring:
  application:
    name: gateway-service

# Downstream service URLs (K8s service DNS names)
microservices:
  order-service-url: http://order-service:8081
  inventory-service-url: http://inventory-service:8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
