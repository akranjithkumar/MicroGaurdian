# ============================================================
# Gateway Service — Deployment + Service (NodePort for external access)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: microguardian
  labels:
    app: gateway-service
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /api/gateway/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          env:
            - name: MICROSERVICES_ORDER_SERVICE_URL
              value: "http://order-service:8081"
            - name: MICROSERVICES_INVENTORY_SERVICE_URL
              value: "http://inventory-service:8082"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: microguardian
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  type: NodePort
